[advisories]
# Deny crates with known security vulnerabilities
ignore = [
    # quick-xml 0.37.5 DoS advisories. The vulnerable code paths are not reached:
    # bo uses a plain quick_xml::Reader at a single call site (YouTube transcript
    # parsing) and never uses NsReader or calls .attributes(). Revisit if either
    # of those changes.
    "RUSTSEC-2026-0194", # attribute duplicate-check O(N^2) blowup
    "RUSTSEC-2026-0195", # unbounded NsReader namespace-declaration allocation
]

[licenses]
# Allow common permissive licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

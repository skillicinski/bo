name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Public API and README examples
        working-directory: testdata/public-api
        run: |
          awk '/^```go$/{capture=1; next} capture && /^```$/{exit} capture{print}' ../../README.md > readme_example.go
          test -s readme_example.go
          test -z "$(gofmt -l readme_example.go)"
          go test -mod=readonly ./...

      - name: Module verification
        run: go mod verify

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Install smoke test
        uses: ./.github/actions/install-smoke

  build:
    needs: gate
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            archive: linux-amd64
          - runs-on: macos-latest
            goos: darwin
            goarch: amd64
            archive: darwin-amd64
          - runs-on: macos-latest
            goos: darwin
            goarch: arm64
            archive: darwin-arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags '-s -w' -o build/bo ./cmd/bo

      - name: Package
        run: tar czf bo-${{ matrix.archive }}.tar.gz -C build bo

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bo-${{ matrix.archive }}
          path: bo-${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bo-*
          merge-multiple: true
          path: artifacts/

      - name: Create GitHub Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES" \
            artifacts/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: create-release
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Stage publish to npm (requires maintainer approval)
        run: cd npm && npm stage publish --access public

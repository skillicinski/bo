name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Public API and README examples
        working-directory: testdata/public-api
        run: |
          awk '/^```go$/{capture=1; next} capture && /^```$/{exit} capture{print}' ../../README.md > readme_example.go
          test -s readme_example.go
          test -z "$(gofmt -l readme_example.go)"
          go test -mod=readonly ./...

      - name: Module verification
        run: go mod verify

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Install smoke test
        uses: ./.github/actions/install-smoke

[package]
name = "bo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Create local bo seed directories"
repository = "https://github.com/skillicinski/bo.git"

[dependencies]
htmd = "0.5"
markup5ever_rcdom = "0.38"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
